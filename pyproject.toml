[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refchecker"
version = "0.1.0"
description = "Citation verification system for academic papers — validates references via Crossref, Semantic Scholar, OpenAlex, AMiner, and more."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "DeepScientist"},
]
keywords = ["citation", "verification", "academic", "bibliography", "bibtex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    # Parsing
    "bibtexparser>=2.0.0b7",
    # Fuzzy matching
    "rapidfuzz>=3.9",
    # HTTP client
    "httpx>=0.28",
    # API clients
    "habanero>=2.3",
    "semanticscholar>=0.8",
    "pyalex>=0.14",
    # CLI
    "click>=8.1",
    # Export
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "qasync>=0.27",
]
scraping = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "scholarly>=1.7",
]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    # Linting & formatting
    "ruff>=0.5",
    # Type checking
    "mypy>=1.10",
    # Pre-commit
    "pre-commit>=3.7",
]
all = [
    "refchecker[gui,scraping,dev]",
]

[project.scripts]
refchecker = "refchecker.cli.main:cli"

[project.entry-points."refchecker.adapters"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["refchecker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that hit real APIs",
    "gui: marks GUI tests requiring display",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bibtexparser.*",
    "habanero.*",
    "semanticscholar.*",
    "pyalex.*",
    "rapidfuzz.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["refchecker"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
